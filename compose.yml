name: myanimestats-deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/titouan-lacombe/myanimestats:20261119
    restart: always
    mem_limit: 768m
    logging: *default-logging
    environment:
      TZ: Europe/Paris
      PUID: $PUID
      PGID: $PGID
      LOG_LEVEL: DEBUG
    volumes:
      - ./data:/app/data
    networks:
      - web-gateway
    labels:
      - traefik.enable=true
      - traefik.http.services.myanimestats-$ENV.loadbalancer.server.port=8000
      - traefik.http.services.myanimestats-$ENV.loadbalancer.healthcheck.path=/healthz/
      - traefik.http.services.myanimestats-$ENV.loadbalancer.healthcheck.hostname=$APP_DOMAIN
      - traefik.http.routers.myanimestats-$ENV.rule=Host(`$APP_DOMAIN`)
      - traefik.http.routers.myanimestats-$ENV.entrypoints=websecure
      - traefik.http.routers.myanimestats-$ENV.tls=true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  web-gateway:
    external: true
